baseURL: "https://learn.fincz.com/"
title: "Fincz Learn"
theme: hextra

enableRobotsTXT: true
enableGitInfo: false
hasCJKLanguage: false

defaultContentLanguage: en

outputs:
  home: [html, llms]
  page: [html, markdown]
  section: [html, rss, markdown]

markup:
  highlight:
    noClasses: false
  goldmark:
    renderer:
      unsafe: true

menu:
  main:
    - identifier: courses
      name: Courses
      pageRef: /courses
      weight: 1
    - identifier: guides
      name: Guides
      pageRef: /guides
      weight: 2
    - identifier: practice
      name: Practice
      pageRef: /practice
      weight: 3
    - name: Search
      weight: 4
      params:
        type: search
    - name: Theme
      weight: 5
      params:
        type: theme-toggle

params:
  description: "Fincz Learn — Free & Structured Developer Courses, AI Engineering Guides, and Practice Tracks"
  
  navbar:
    displayTitle: true
    displayLogo: true
    logo:
      path: images/fincz-logo-black.png
      dark: images/fincz-logo-white.png
      width: 100
      height: 36
    width: wide

  theme:
    default: system
    displayToggle: false

  footer:
    enable: true
    displayCopyright: false
    displayPoweredBy: false
    width: wide

  displayUpdatedDate: true
  dateFormat: "January 2, 2006"

  search:
    enable: true
    type: flexsearch

  editURL:
    enable: false

  icons:
    remote:
      enable: true