{{- $src := "" }}
{{- if .IsNamedParams }}
  {{- $src = .Get "src" }}
{{- else }}
  {{- $src = .Get 0 }}
{{- end }}
<div class="hx:my-4 hx:overflow-hidden hx:rounded-xl hx:border hx:border-neutral-200 hx:dark:border-neutral-800">
  <iframe src="{{ $src }}" class="hx:w-full hx:h-[600px] hx:border-0" loading="lazy" allowfullscreen></iframe>
</div>
